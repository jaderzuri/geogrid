worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 1m;
    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=landing:10m rate=80r/s;
    limit_req_zone $binary_remote_addr zone=status:10m rate=120r/s;
    limit_req_zone $binary_remote_addr zone=report:10m rate=20r/s;

    upstream smart_grid {
        server smart-grid:8000;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        location = /api/landing/leads {
            limit_req zone=landing burst=500 nodelay;
            proxy_pass http://smart_grid;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ^~ /api/landing/status/ {
            limit_req zone=status burst=500 nodelay;
            proxy_pass http://smart_grid;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location ^~ /api/landing/report/ {
            limit_req zone=report burst=100 nodelay;
            proxy_pass http://smart_grid;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://smart_grid;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
