    name: ${P02_VOLUME_PREFIX:-geogrid-p02-20261125-processor}-smart-grid-state
  n8n-state:
    name: ${P02_VOLUME_PREFIX:-geogrid-p02-20261125-processor}-n8n-state
  mock-certs:
    name: ${P02_VOLUME_PREFIX:-geogrid-p02-20261125-processor}-mock-certs
