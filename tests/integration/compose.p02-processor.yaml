    image: geogrid-homolog-20261125-verified2-smart-grid:latest
  mock-services:
    image: geogrid-homolog-20261125-verified2-mock-services:latest
  test-runner:
    image: geogrid-homolog-20261125-verified2-test-runner:latest
    volumes:
      - ./test_p02_n8n.mjs:/app/test_p02_n8n.mjs:ro
volumes:
  postgres-state:
    name: ${P02_VOLUME_PREFIX:-geogrid-p02-20261125-processor}-postgres-state
